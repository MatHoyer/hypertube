services:
  migrate:
    build:
      context: .
      dockerfile: ./packages/server-core/Dockerfile.migration
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: "no"
    networks:
      - hypertube-network

  app:
    container_name: hypertube-app-compact
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile.compact
    env_file: .env
    environment:
      - NODE_ENV=PROD
      - PROWLARR_API_KEY_FILE=/prowlarr-config/api_key
      - SERVE_FRONT=true
      - RUN_SCHEDULER=true
      - CACHE_DRIVER=memory
    volumes:
      - prowlarr_config:/prowlarr-config:ro
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
      prowlarr-indexers-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  downloader:
    container_name: hypertube-downloader-prod
    build:
      context: .
      dockerfile: ./apps/downloader/Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - TRANSMISSION_HOST=vpn
      - S3_ENDPOINT=s3
    volumes:
      - downloads_transmission:/downloads-transmission
    networks:
      - hypertube-network
    depends_on:
      - app

  prowlarr-init:
    image: alpine:3.21
    container_name: hypertube-prowlarr-init
    env_file: .env
    environment:
      - PROWLARR_CONFIG_DIR=/config
      - PROWLARR_PORT=${PROWLARR_PORT}
    volumes:
      - prowlarr_config:/config
      - ./scripts/prowlarr-init-config.sh:/prowlarr-init-config.sh:ro
    entrypoint: /bin/sh
    command: /prowlarr-init-config.sh
    restart: "no"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: hypertube-prowlarr-prod
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr_config:/config
    network_mode: container:vpn
    restart: unless-stopped
    depends_on:
      prowlarr-init:
        condition: service_completed_successfully

  prowlarr-indexers-init:
    image: alpine:3.21
    container_name: hypertube-prowlarr-indexers-init
    env_file: .env
    environment:
      - PROWLARR_URL=http://vpn:${PROWLARR_PORT}
      - PROWLARR_API_KEY_FILE=/config/api_key
      - PROWLARR_CONFIG_DIR=/config
    volumes:
      - prowlarr_config:/config:ro
      - ./scripts/prowlarr-init-indexers.sh:/prowlarr-init-indexers.sh:ro
    networks:
      - hypertube-network
    entrypoint: /bin/sh
    command: -c "apk add --no-cache curl jq >/dev/null && /prowlarr-init-indexers.sh"
    depends_on:
      - prowlarr
    restart: "no"

  subtitle-proxy:
    container_name: hypertube-subtitle-proxy-prod
    build:
      context: .
      dockerfile: ./apps/subtitle-proxy/Dockerfile.prod
    env_file: .env
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - S3_ENDPOINT=s3
    network_mode: container:vpn

networks:
  hypertube-network:
    external: true

volumes:
  downloads_transmission:
    name: hypertube_downloads_transmission
  prowlarr_config:
    name: hypertube_prowlarr_config
