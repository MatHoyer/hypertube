services:
  migrate:
    build:
      context: .
      dockerfile: ./packages/server-core/Dockerfile.migration
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: "no"
    networks:
      - hypertube-network

  client:
    container_name: hypertube-client-prod
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile.prod
    env_file: .env
    ports:
      - "${CLIENT_PORT}:8080"
    networks:
      - hypertube-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    container_name: hypertube-server-prod
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile.prod
    env_file: .env
    environment:
      - NODE_ENV=PROD
      - PROWLARR_API_KEY_FILE=/prowlarr-config/api_key
    volumes:
      - prowlarr_config:/prowlarr-config:ro
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
      prowlarr-indexers-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  downloader:
    container_name: hypertube-downloader-prod
    build:
      context: .
      dockerfile: ./apps/downloader/Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - S3_ENDPOINT=s3
    # Runs its own tracker/DHT/peer-wire networking in-process (no external
    # torrent daemon), so it needs the same network_mode: container:vpn every
    # other torrent/scraping sidecar uses (prowlarr, subtitle-proxy) — it
    # still reaches redis/s3 by name because vpn itself is on
    # hypertube-network. See apps/downloader/TORRENT_ENGINE_ARCHITECTURE.md.
    network_mode: container:vpn
    # Shares gluetun's network namespace above but not its filesystem — this
    # is how it reads the VPN_PORT_FORWARDING port gluetun negotiates (see
    # docker-compose-vpn.yml and apps/downloader/src/handlers/movie/torrent/listen-port.ts).
    volumes:
      - gluetun_data:/tmp/gluetun:ro
    # main.ts deliberately exits on a fatal/uncaught error after failing the
    # in-flight job (see handleFatalError) — needs a restart policy or the
    # worker just stays dead until someone notices.
    restart: unless-stopped
    depends_on:
      - server

  scheduler:
    container_name: hypertube-scheduler-prod
    build:
      context: .
      dockerfile: ./apps/scheduler/Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - S3_ENDPOINT=s3
    networks:
      - hypertube-network
    depends_on:
      - server

  prowlarr-init:
    image: alpine:3.21
    container_name: hypertube-prowlarr-init
    env_file: .env
    environment:
      - PROWLARR_CONFIG_DIR=/config
      - PROWLARR_PORT=${PROWLARR_PORT}
    volumes:
      - prowlarr_config:/config
      - ./scripts/prowlarr-init-config.sh:/prowlarr-init-config.sh:ro
    entrypoint: /bin/sh
    command: /prowlarr-init-config.sh
    restart: "no"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: hypertube-prowlarr-prod
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr_config:/config
    network_mode: container:vpn
    restart: unless-stopped
    depends_on:
      prowlarr-init:
        condition: service_completed_successfully

  prowlarr-indexers-init:
    image: alpine:3.21
    container_name: hypertube-prowlarr-indexers-init
    env_file: .env
    environment:
      - PROWLARR_URL=http://vpn:${PROWLARR_PORT}
      - PROWLARR_API_KEY_FILE=/config/api_key
      - PROWLARR_CONFIG_DIR=/config
    volumes:
      - prowlarr_config:/config:ro
      - ./scripts/prowlarr-init-indexers.sh:/prowlarr-init-indexers.sh:ro
    networks:
      - hypertube-network
    entrypoint: /bin/sh
    command: -c "apk add --no-cache curl jq >/dev/null && /prowlarr-init-indexers.sh"
    depends_on:
      - prowlarr
    restart: "no"

  subtitle-proxy:
    container_name: hypertube-subtitle-proxy-prod
    build:
      context: .
      dockerfile: ./apps/subtitle-proxy/Dockerfile.prod
    env_file: .env
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - S3_ENDPOINT=s3
    network_mode: container:vpn

networks:
  hypertube-network:
    external: true

volumes:
  prowlarr_config:
    name: hypertube_prowlarr_config
  gluetun_data:
    name: hypertube_gluetun_data
