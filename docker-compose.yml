services:
  db:
    container_name: ${POSTGRES_HOST}
    image: postgres:17-bookworm
    env_file: .env
    ports:
      - ${POSTGRES_PORT}
    volumes:
      - hypertube_data:/var/lib/postgresql/data
    networks:
      - hypertube-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: hypertube_redis
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT}
    networks:
      - hypertube-network

  s3:
    container_name: hypertube_s3
    image: rustfs/rustfs:1.0.0
    ports:
      - 9000
      - 9001
    networks:
      - hypertube-network
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ROOT_USER}
      - RUSTFS_SECRET_KEY=${S3_ROOT_PASSWORD}
    volumes:
      - s3_data:/data

  s3-init:
    build:
      context: .
      dockerfile: Dockerfile.s3-init
    depends_on:
      - s3
    networks:
      - hypertube-network
    environment:
      - S3_ROOT_USER=${S3_ROOT_USER}
      - S3_ROOT_PASSWORD=${S3_ROOT_PASSWORD}
      - CLIENT_URL=${CLIENT_URL}
    restart: no

volumes:
  hypertube_data:
  s3_data:

networks:
  hypertube-network:
    external: true
